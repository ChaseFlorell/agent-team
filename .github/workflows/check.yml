name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tools/check-generic-instructions.ts
      - run: node tools/check-frontmatter.ts
      - run: node --test tests/*.test.ts
