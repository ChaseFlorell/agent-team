name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generic-instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check-generic-instructions.ts
